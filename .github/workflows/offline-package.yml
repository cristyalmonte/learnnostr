name: Build offline package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build package
        run: ./scripts/package-offline.sh "${GITHUB_REF_NAME:-manual}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnnostr-offline
          path: |
            dist/learnnostr-offline-*.zip
            dist/learnnostr-offline-*.zip.sha256

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/learnnostr-offline-*.zip
            dist/learnnostr-offline-*.zip.sha256
